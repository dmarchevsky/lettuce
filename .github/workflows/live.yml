name: live

# Tier B: the stack actually running, not just the code compiling. Advisory on
# purpose — this workflow is NOT in the required `ci` check, so a red X here is
# information, not a block. Its first job is to measure itself: the app-server
# image has to be pulled and built on a cold runner, and whether that is 4
# minutes or 15 decides whether Tier B ever becomes a gate for web/** or stays
# a nightly. The run page's per-step timings are the answer; read them before
# deciding anything from this file.
#
# What it proves that Tier A cannot: the compose file comes up as shipped (env
# parsing, ports, mounts, profiles), the BFF reaches the app-server WebSocket,
# and the real UI in a real browser at phone and desktop widths. `bun run smoke`
# stays out of all of this — it mutates live state and needs an agent to exist.
#
# No secrets, ever, same rule as Tier A: this runs for fork PRs with nothing but
# a throwaway session secret, in local (non-Access) mode with no sidecars.

on:
  pull_request:
  push:
    branches: [main]
  # The measurement does not depend on anyone opening a PR: a nightly run keeps
  # the timings current and catches a compose or app-server-image regression
  # that Tier A cannot see at all.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: live-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.0"
  # See the ui-check step: layout needs an agent, a CI stack has none.
  UI_CHECK: "off"

jobs:
  live:
    name: compose up + ui-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # ui-check asserts on layout, so it needs a real Chromium. --with-deps
      # pulls the system libraries headless Chromium wants.
      - name: Install Chromium for ui-check
        run: bunx playwright install --with-deps chromium

      # docker/.env is gitignored, so CI writes the smallest thing that boots: state
      # under the runner temp dir, local mode (dev bypass, no Cloudflare Access) and
      # NO compose profiles, which means no cloudflared and no sidecars — the image
      # also skips the Codex and Claude CLIs, because CODING_FEATURES is derived from
      # this same string. Three things the first two runs had to learn:
      #   • SESSION_SECRET must be ≥32 characters or the BFF refuses to start.
      #   • there are TWO binds. BFF_BIND is the host side of Compose's published
      #     port (keep it loopback on a runner); the BFF's own bind is separate, and
      #     dev bypass pins it to loopback unless DEV_BYPASS_ALLOW_REMOTE=true —
      #     a loopback bind inside the namespace means the published port has
      #     nothing to talk to, which is how run one lost /readyz for 450s.
      #   • the container listens on 8080; the runner reaches it on BFF_PORT.
      - name: Write compose env
        run: |
          cat > docker/.env <<EOF
          BFF_BIND=127.0.0.1
          BFF_PORT=8090
          PUBLIC_ORIGIN=http://127.0.0.1:8090
          LETTA_STATE_DIR=${{ runner.temp }}/lettuce-state
          SESSION_SECRET=$(openssl rand -hex 32)
          DEV_BYPASS_EMAIL=ci@lettuce.test
          DEV_BYPASS_ALLOW_REMOTE=true
          COMPOSE_PROFILES=
          EOF
          mkdir -p "${{ runner.temp }}/lettuce-state"

      - name: Build images
        run: |
          start=$SECONDS
          docker compose -f docker/compose.yml build
          echo "::notice image build took $((SECONDS - start))s"

      - name: Up
        run: docker compose -f docker/compose.yml up -d

      # The BFF answers /readyz only once the upstream connection is up, so this
      # loop is also the proof that the app-server WebSocket connected — the thing
      # deploy-check asserts and the thing a compose file can silently break.
      # Four minutes is generous: a healthy boot reaches it in seconds, and the
      # first run's 450 s wait was this file's bug, not the stack's.
      - name: Wait for /readyz
        run: |
          ok=0
          for i in $(seq 1 48); do
            if curl -fsS --max-time 5 http://127.0.0.1:8090/readyz >/dev/null 2>&1; then
              ok=1; break
            fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::/readyz never came up"
            docker compose -f docker/compose.yml ps
            exit 1
          fi
          echo "readyz after $((i * 5))s (upper bound)"

      # ui-check drives the real UI, and the real UI is about agents: the switcher,
      # the composer, the Settings tabs reached through a selected agent. A CI stack
      # has an empty state dir, so it has no agent — the first run proved it out by
      # passing 40-some layout assertions and then timing out on
      # `.switcher-agents .switcher-card-title`. There is nothing to count and no
      # cheap way to seed one: the BFF has no create-agent route (creation is
      # `create_agent` over the app-server WebSocket, which CI does not speak), so a
      # seed needs an app-server-side fixture or a ui-check that asserts on the empty
      # state. That is the reviewer's call, and it is env.UI_CHECK rather than a
      # heuristic: flip it to "on" when a seed path exists, and until then this tier
      # is honestly compose-boot + upstream-connection, not layout.
      - name: ui-check
        if: env.UI_CHECK == 'on'
        run: bun run ui-check http://127.0.0.1:8090

      - name: ui-check not applicable on a fresh stack
        if: env.UI_CHECK != 'on'
        run: |
          echo "::notice title=ui-check skipped::A CI stack boots with no agent to drive, so layout is not verified here. Compose boot and the upstream connection are. Flip env.UI_CHECK in this file when a seed path exists (see the comment above)."

      - name: Logs
        if: failure()
        run: docker compose -f docker/compose.yml logs --tail=200

      - name: Teardown
        if: always()
        run: docker compose -f docker/compose.yml down -v --remove-orphans
