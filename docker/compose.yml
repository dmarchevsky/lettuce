# Everything this stack builds comes from THIS repo — the sibling letta-code
# fork is dev tooling (drift reporting via scripts/sync-upstream.sh), not a
# build input. A host needs only `git` and `docker` to deploy:
#   docker compose -f lettuce/docker/compose.yml up -d
#
# ── Durable state lives under one host root ──────────────────────────────────
# LETTA_STATE_DIR anchors every bind mount. Relative values resolve against
# this file's directory, and the `../..` default reproduces the original dev
# layout exactly (workspaces/ alongside the two repos). Prod sets an absolute
# path (e.g. /srv/letta) so the mounts cannot wander into whatever directory a
# compose manager happens to clone the stack into. Docker creates missing bind
# sources as root, which is correct here — the app-server runs as uid 0 — so a
# first boot on a clean host needs no mkdir.
#
# ── Why every service shares one network namespace ───────────────────────────
# The app-server refuses to listen on a non-loopback address without
# `--ws-auth` (app-server.ts: isUnauthenticatedNonLoopbackListener), but
# `letta channel-gateway` sends no bearer token at all (gateway-local.ts calls
# createAppServerClient with no authToken). Those two facts together mean
# Telegram is only reachable when the app-server listens on loopback with auth
# off — so the BFF and the gateway join the app-server's network namespace and
# reach it at 127.0.0.1:4500. Nothing outside that namespace can, which is
# stronger isolation than a shared token on a bridge network.
# The compose project name is `lettuce`, so containers come up as lettuce-*-1 and
# the named volumes are lettuce_bff-data and friends. (Older installs ran under
# the `letta` project name, so their volumes keep that prefix; nothing looks
# them up by name except scripts/migrate-volumes-to-host.sh, which is a
# one-shot for exactly those installs.)
name: lettuce

services:
  app-server:
    # Upstream's published image plus the Codex and Claude Code CLIs and our
    # shims for them (docker/codex/Dockerfile) — nothing of upstream's is
    # modified. Pinned to
    # a published release, never `latest`: the UI is compiled against this
    # exact release's protocol types (see CLAUDE.md), so the running app-server
    # must match. `scripts/check-version-pin.ts` asserts every copy of this
    # literal agrees. The build context is docker/codex alone, so docker/.env
    # never reaches the daemon.
    #
    # Codex is pinned separately (CODEX_VERSION): letta-code drives it over
    # `codex app-server`, whose protocol the shim rewrites one field of, so a
    # Codex bump is re-verified like a letta-code bump, never floated. Claude
    # Code likewise (CLAUDE_CODE_VERSION): the shim depends on its
    # `auth status --json` preflight shape and stream-json flags.
    #
    # The GitHub CLI (GH_VERSION) is there for letta-code's WatchPR tool. Its
    # login lives in GH_CONFIG_DIR, under the persisted /root/.letta, so it
    # survives recreates; sign in once with `gh auth login --with-token`.
    #
    # CODING_FEATURES is the raw COMPOSE_PROFILES string: the image installs
    # the Codex CLI only when it contains the token `codex`, and the Claude
    # Code CLI only when it contains `claude` — two VIRTUAL profiles, tokens no
    # service declares, so they install no container and gate no sidecar; they
    # decide the build and the BFF's feature flags together. The image then
    # writes what it actually baked into /opt/lettuce/features, and the BFF
    # logs loudly when a token is on but the CLI is missing.
    #
    # The image TAG does not change with the token list (it names version
    # pins), so toggling a coding token REQUIRES a rebuild — `compose up`
    # without `--build` silently keeps the old image. Enabling needs the exact
    # comma-delimited token: `…codex…,`.
    #
    # Default container hardening (seccomp, AppArmor, default capabilities) is
    # deliberately left intact: this is the one service agent-authored shell
    # commands run in, so the container -> host boundary is the one that
    # matters. letta-code's bubblewrap sandbox used to need SYS_ADMIN plus both
    # profiles unconfined, and was switched off because it traded that boundary
    # for a cross-agent one that did not hold — see LETTA_FS_SANDBOX below.
    build:
      context: codex
      args:
        LETTA_CODE_VERSION: ${LETTA_CODE_VERSION:-0.34.1}
        CODEX_VERSION: ${CODEX_VERSION:-0.157.1}
        GH_VERSION: ${GH_VERSION:-2.101.0}
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.289}
        CODING_FEATURES: ${COMPOSE_PROFILES:-}
    image: lettuce-app-server:${LETTA_CODE_VERSION:-0.34.1}-codex${CODEX_VERSION:-0.157.1}-gh${GH_VERSION:-2.101.0}-claude${CLAUDE_CODE_VERSION:-2.1.289}
    # An init process as PID 1, so exited orphans are reaped. Without it PID 1
    # is `node … letta server`, which waits only on children it spawned: every
    # process an agent shell backgrounds (`&`, nohup, servers) and outlives is
    # reparented to node and stays a zombie, counting against the cgroup's
    # pids.max until the container restarts. Near that cap a subagent's spawn
    # fails with EAGAIN, which letta-code reports only as "Subagent process
    # exited with code unknown" (the errno is logged by spawn-diagnostics.cjs).
    init: true
    command:
      - letta
      - server
      - --listen
      - ws://127.0.0.1:4500
    # The image sets WORKDIR /workspace, which is container-layer storage: agent
    # files written there vanish on recreate. /work is the bind mount below, so
    # anchoring the boot CWD here is what makes agent work persist and be
    # visible on the host. Agents get /work/<agent-id>; /work is the shared level.
    working_dir: /work
    environment:
      # Container timezone. Docker defaults to UTC; this makes the cron
      # scheduler (so "brief me at 7" fires at 7 there), the timestamps on
      # conversations and memory, and every container's logs agree on one local
      # time. Override TZ in docker/.env with any IANA name (e.g.
      # Europe/Berlin). Every image in this stack ships tzdata, so the value
      # takes effect; the same TZ is set on each service below.
      TZ: ${TZ:-America/Los_Angeles}
      # No Letta Cloud: agents, conversations and transcripts stay on disk here.
      LETTA_LOCAL_BACKEND_EXPERIMENTAL: "true"
      LETTA_LOCAL_BACKEND_DIR: /data/local-backend
      # getFallbackWorkingDirectory() prefers this over process.cwd().
      USER_CWD: /work
      # gh keeps its login here, on the letta-home bind mount (see above).
      GH_CONFIG_DIR: /root/.letta/gh
      # letta-code's bubblewrap filesystem sandbox: OFF, explicitly. Unset is
      # not off — memory subagents are sandboxed by default whenever a bwrap
      # backend exists (sandbox/availability.ts isFsSandboxEnabled) — so the
      # "0" is load-bearing, and the image carries no bubblewrap either.
      #
      # Why off (measured 2026-09-25 in this container, with the sandbox on):
      #  - It did not hold against a hostile agent. Wrapped shells kept the
      #    container's full capability set (buildBwrapArgs passes no
      #    --cap-drop), so one `umount` removed the mask over other agents'
      #    memory. Other agents' conversations were never masked, and
      #    /root/.letta/settings.json stayed writable — an MCP entry there is a
      #    command the app-server runs unwrapped on reload.
      #  - Running bwrap as root required SYS_ADMIN plus seccomp and AppArmor
      #    unconfined, which weakened the container -> host boundary for every
      #    agent shell.
      # All agents here belong to one person, so the container boundary is the
      # one worth keeping. In-process file tools keep letta-code's static
      # cross-agent guard (permissions/cross-agent-guard.ts), which does not
      # depend on this flag. Real agent-to-agent isolation would need one
      # app-server container per agent.
      #
      # Changing this value recreates app-server, which drops the BFF's
      # permanent upstream connection — always `docker compose up -d` unscoped.
      LETTA_FS_SANDBOX: "0"
      # 30 minutes, up from letta-code's 5-minute default
      # (DEFAULT_LOCAL_PROVIDER_TIMEOUT_MS in backend/local/local-provider-timeout.ts).
      #
      # This buys PREFILL headroom, not longer generations. It arrives as the
      # OpenAI SDK's `timeout`, whose abort timer is cleared in a `finally` once
      # the fetch resolves — and a streaming fetch resolves on HEADERS. So it
      # bounds connect + queueing + prompt eval; once tokens flow the stream is
      # unbounded, and a mid-stream stall is not covered by anything at all.
      #
      # The global name is deliberate over the provider-specific
      # LETTA_CODE_OPENAI_COMPATIBLE_TIMEOUT_MS: there is one local provider
      # here, and the setting should follow it if the endpoint is ever swapped.
      # Milliseconds to match the variable name; the parser would also take
      # "30m", but an unparseable value throws rather than falling back.
      LETTA_CODE_LOCAL_PROVIDER_TIMEOUT_MS: "1800000"
      # Up from letta-code's 60s/5s defaults
      # (stream-stall-reconciler.ts: DEFAULT_STREAM_STALL_RECONCILE_MS /
      # DEFAULT_STREAM_STALL_STATUS_TIMEOUT_MS).
      #
      # This reconciler is unrelated to the LLM timeout above: it watches the
      # app-server's OWN relay of a run's stream to the websocket listener (and
      # so to the BFF/browser) for 60s of total silence, then asks the run's
      # status endpoint (5s budget) whether the run is still active before
      # giving up. It only fires "Stream went silent, reconnecting to recover
      # the missed tail" when that status check itself is inconclusive — a
      # non-active status, or the lookup missing its own timeout — and aborting
      # is client-read-only: it does not touch the server-side run.
      #
      # A cold llama.cpp cache (first turn after a restart, or any turn against
      # a brand-new large context) can spend several minutes in prefill before
      # a single token streams, which both raises the number of 60s silence
      # windows a long prefill spans and, since that same window is also when
      # the host is busiest, raises the odds that one status lookup misses its
      # 5s budget purely from load — a false-positive reconnect on a completely
      # healthy run. Confirmed against a live llama.cpp log showing continuous
      # token generation and zero errors at the moment this fired.
      #
      # 180s gives a cold multi-minute prefill far fewer silence windows to
      # trip over; 15s gives the status lookup itself more slack under load.
      LETTA_STREAM_STALL_RECONCILE_MS: "180000"
      LETTA_STREAM_STALL_STATUS_TIMEOUT_MS: "15000"
      # Web apps an agent serves to the user: the published range below, and the
      # host address the user's browser reaches it on (set AGENT_APP_HOST in
      # docker/.env, e.g. the server's LAN IP). Read by the serving-web-apps
      # skill, which is how agents learn about both. The BFF installs that skill
      # (docker/agent-skills) into /root/.letta/skills on every connect — never
      # bind-mount repo files here: under the deploy manager a relative source
      # resolves inside its container, and the daemon mounts an empty directory.
      AGENT_APP_PORTS: "3000-3099"
      AGENT_APP_HOST: ${AGENT_APP_HOST:-}
      # Codex subagent workers (`subagent_type: "codex"`). Its home lives on the
      # letta-home bind mount so threads survive a recreate — follow-ups and
      # SendAgentMessage steering resume them by id — and so the BFF can read
      # their rollout files for the run viewer. The BFF writes config.toml,
      # auth.json and lettuce.json there from Settings → Codex; the shim
      # refuses to run until that says enabled.
      CODEX_HOME: /root/.letta/codex
      # Claude Code subagent workers (`subagent_type: "claude-code"`). Same
      # rationale as CODEX_HOME: its `projects/` transcripts live on the
      # letta-home bind mount so they survive a recreate and the BFF can read
      # them for the run viewer. The BFF writes lettuce.json there from
      # Settings → Claude Code; the shim reads it for the switch and injects
      # its credentials as env (Claude Code has no config file for them) —
      # an endpoint's URL and token, or the user's Claude subscription OAuth
      # token. So this directory holds secrets, the subscription one included.
      CLAUDE_CONFIG_DIR: /root/.letta/claude
    volumes:
      - ${LETTA_STATE_DIR:-../..}/letta-home:/root/.letta
      - ${LETTA_STATE_DIR:-../..}/letta-data:/data
      - ${LETTA_STATE_DIR:-../..}/workspaces:/work
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The UI port is published here because the BFF shares this namespace.
    # 0.0.0.0 by default: local mode's whole point is direct LAN reachability
    # with no Cloudflare involved. Switching to cloudflared mode (see the
    # `cloudflared` service below) means Access becomes the only gate that
    # matters, so pair `COMPOSE_PROFILES=cloudflared` with `BFF_BIND=127.0.0.1`
    # to close this direct-LAN door — Compose can't derive one setting's
    # default from another's value, so this is a manual pairing, not automatic.
    ports:
      - "${BFF_BIND:-0.0.0.0}:${BFF_PORT:-8090}:8080"
      # Agent web apps. A server an agent starts inside this container is only
      # reachable from the network on these ports (the serving-web-apps skill
      # tells agents so). No authentication in front of them — anyone who can
      # reach AGENT_APPS_BIND can open them; set it to the LAN address (or
      # 127.0.0.1 to close the door) if 0.0.0.0 is broader than you want.
      # Changing this recreates app-server: always `docker compose up -d`
      # unscoped.
      - "${AGENT_APPS_BIND:-0.0.0.0}:3000-3099:3000-3099"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4500/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  bff:
    build:
      # This repo's root — see the note at the top of this file. `.dockerignore`
      # there keeps node_modules and the git objects out of the context; under a
      # deploy manager this directory is its copy of the tree, which has no `.git`.
      context: ..
      dockerfile: docker/bff.Dockerfile
      # Optional: which commit to stamp the image with. Empty means the build
      # derives it from git metadata in the context — and stamps `+unknown` when the
      # builder has none, which is every deploy-manager build: it builds from
      # its copy of the tree, which carries no `.git`, so prod says `+unknown` and
      # its commit is the deploy record. CI passes --build-arg GIT_SHA=$GITHUB_SHA
      # and `bun run build:bff` passes it from the host checkout.
      args:
        GIT_SHA: ${GIT_SHA:-}
    depends_on:
      app-server:
        condition: service_healthy
    # Share the app-server's loopback; see the note at the top of this file.
    network_mode: "service:app-server"
    # Stopping the BFF closes the one upstream connection, which cancels every
    # turn in flight — so on SIGTERM it first waits for running turns to end
    # (bff/src/shutdown.ts), up to SHUTDOWN_DRAIN_TIMEOUT_SECONDS (default 9m).
    # Docker's default 10s grace would SIGKILL that drain, so this must stay
    # longer than the drain timeout. A redeploy while a turn runs therefore
    # takes up to this long to stop the old container.
    #
    # And the pair must fit inside the deploy manager's `compose up` timeout (900 s,
    # COMPOSE_TIMEOUT), which also covers the image build: at 15m/16m a deploy
    # during a turn timed out, left the new container created but not started,
    # and prod had no bff once the old one drained (2026-09-29).
    stop_grace_period: 10m
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      PORT: "8080"
      SHUTDOWN_DRAIN_TIMEOUT_SECONDS: ${SHUTDOWN_DRAIN_TIMEOUT_SECONDS:-}
      LETTA_APP_SERVER_URL: ws://127.0.0.1:4500
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8090}
      # Pass-through of the exact same value that decides, at the Compose
      # level, whether the `cloudflared` service below even exists — one
      # setting (COMPOSE_PROFILES) drives both. "local" unless it contains
      # "cloudflared". The BFF also reads it as its feature list: exact tokens
      # `search` (web tools), `google`, and the virtual coding tokens `codex`
      # and `claude` decide which Settings sections and integrations are on
      # (bff/src/config.ts). Same comma-separated string, no second setting.
      LETTA_MODE: ${COMPOSE_PROFILES:-local}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      CF_ACCESS_ISSUER: ${CF_ACCESS_ISSUER:-}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      # Optional tuning. Empty means the BFF's own default (bff/src/config.ts) —
      # listed here because this file passes no env_file, so a value set only in
      # docker/.env would never reach the container.
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-}
      FRAME_BUFFER_SIZE: ${FRAME_BUFFER_SIZE:-}
      # The allowlist, and the only source of it — there is no file. A
      # comma-separated list of addresses. Required in cloudflared mode, where
      # it is the check that still stands if the Cloudflare Access policy is
      # ever misconfigured. In local mode DEV_BYPASS_EMAIL implies its own
      # entry, so leaving this empty is correct and needs no second setting.
      # See bff/src/config.ts readAllowedUsers().
      ALLOWED_USERS: ${ALLOWED_USERS:-}
      DEV_BYPASS_EMAIL: ${DEV_BYPASS_EMAIL:-}
      DEV_BYPASS_ALLOW_REMOTE: ${DEV_BYPASS_ALLOW_REMOTE:-}
      # Push is fully optional — leave all three unset to run without it.
      PUSH_VAPID_PUBLIC_KEY: ${PUSH_VAPID_PUBLIC_KEY:-}
      PUSH_VAPID_PRIVATE_KEY: ${PUSH_VAPID_PRIVATE_KEY:-}
      PUSH_VAPID_CONTACT_EMAIL: ${PUSH_VAPID_CONTACT_EMAIL:-}
      PUSH_SUBSCRIPTIONS_FILE: /app/data/push-subscriptions.json
      # Backends of the agents' native web_search / fetch_webpage tools
      # (bff/src/web-tools/): SearXNG answers searches, ddg-mcp fetches pages and
      # is the search fallback. Empty disables that backend.
      SEARXNG_URL: ${SEARXNG_URL-http://searxng:8080}
      DDG_MCP_URL: ${DDG_MCP_URL-http://ddg-mcp:8000/mcp}
      # Provider mods for vision-capable models behind OpenAI-only endpoints
      # (JSON array — bff/src/providers/vision.ts, docs/CONFIGURATION.md).
      # Empty means no extra providers.
      VISION_PROVIDERS: ${VISION_PROVIDERS:-}
      # Settings → Google. Changing Google access from a dev-bypass session is
      # refused unless this is "true": agent shells share this namespace and can
      # sign themselves in through the bypass. See bff/src/config.ts.
      GOOGLE_ALLOW_DEV_BYPASS: ${GOOGLE_ALLOW_DEV_BYPASS:-}
      # Defaults to ${PUBLIC_ORIGIN}/api/google/oauth/callback. Google accepts
      # only https or localhost here, so a plain-http LAN origin needs an
      # override such as http://localhost:8090/api/google/oauth/callback.
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
    volumes:
      # Google access policy and OAuth token (bff/src/google/): shared with the
      # google-mcp sidecar and NOTHING else. The app-server and channel-gateway
      # must never mount these — agent shells run there, and whatever they can
      # write, an agent can change about its own Google access.
      - google-policy:/app/google/policy
      - google-creds:/app/google/creds
      # Push subscriptions: device endpoints the BFF rewrites on every
      # subscribe/unsubscribe. Nothing reads this by hand and losing it only
      # means re-subscribing from Settings → Notifications, so unlike the state
      # under LETTA_STATE_DIR it does not need to be on the host.
      - bff-data:/app/data
      # Same host directory the app-server mounts read-write at /work, and at
      # the same absolute path inside the container — file-stat.ts stats paths
      # exactly as the app-server reported them.
      # Read-only here: the BFF only needs `stat()` to report real modified
      # times for the Files tab (get_tree carries no mtime field, and the
      # fork cannot be patched to add one — see CLAUDE.md). It never lists
      # directories from this mount for the Files tab, only stats paths get_tree
      # already returned, so it can't show anything get_tree wouldn't have.
      # Settings → Skills does list `<cwd>/.agents/skills` here (see below).
      - ${LETTA_STATE_DIR:-../..}/workspaces:/work:ro
      # Settings → Skills (bff/src/skills/): the global, agent and memfs skill
      # roots, read-only and at the app-server's own absolute paths so the
      # symlinks in them resolve. Not over the protocol: upstream publishes no
      # skill list outside a live turn, and its directory listings skip
      # symlinks — which is what every `skill_enable`d skill is. The BFF could
      # already read these files through the upstream connection; the mounts
      # add no reach, only the ability to follow a link.
      - ${LETTA_STATE_DIR:-../..}/letta-home:/root/.letta:ro
      - ${LETTA_STATE_DIR:-../..}/letta-data/local-backend/memfs:/data/local-backend/memfs:ro
    restart: unless-stopped

  # Telegram and the other messaging channels. A separate process by design:
  # the app-server only dispatches channel_* commands when a gateway is
  # attached (message-router.ts: runtime.serviceCommandTypes), so without this
  # service every channel command returns silence.
  #
  # Opt-in, like `cloudflared`: created only when COMPOSE_PROFILES contains
  # "telegram" (e.g. COMPOSE_PROFILES=cloudflared,telegram). Off by default
  # because nothing here uses a channel yet and it costs ~170 MiB idle. Turning
  # it off later does NOT remove an existing container — `up -d` just stops
  # managing it — so stop it explicitly:
  #   docker compose -f docker/compose.yml --profile telegram rm -sf channel-gateway
  channel-gateway:
    profiles: ["telegram"]
    # Upstream's published image, used as-is — same image as the app-server.
    image: letta/letta:${LETTA_CODE_VERSION:-0.34.1}
    depends_on:
      app-server:
        condition: service_healthy
    network_mode: "service:app-server"
    command:
      - letta
      - channel-gateway
      - --app-server-url
      - ws://127.0.0.1:4500
      - --restore-enabled-channels
      - --allow-startup-errors
    # Same anchor as the app-server: a gateway-initiated turn must not land in a
    # different directory from a browser-initiated one.
    working_dir: /work
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      LETTA_LOCAL_BACKEND_EXPERIMENTAL: "true"
      LETTA_LOCAL_BACKEND_DIR: /data/local-backend
      USER_CWD: /work
      # gh keeps its login here, on the letta-home bind mount (see above).
      GH_CONFIG_DIR: /root/.letta/gh
      # No LETTA_FS_SANDBOX needed: the gateway is a relay that hands inbound
      # channel messages to the app-server, which runs the turn and every tool.
      # The app-server owns scheduling; a second scheduler would fight for the lease.
      LETTA_DISABLE_CRON_SCHEDULER: "1"
    volumes:
      - ${LETTA_STATE_DIR:-../..}/letta-home:/root/.letta
      - ${LETTA_STATE_DIR:-../..}/letta-data:/data
      - ${LETTA_STATE_DIR:-../..}/workspaces:/work
    restart: unless-stopped

  # Metasearch behind the agents' native `web_search` tool: the BFF queries its
  # JSON API (bff/src/web-tools/searxng.ts). Settings are baked into the image
  # (docker/searxng/settings.yml, which also records which engines were probed
  # to work from a residential IP). No `ports:` and no auth; the limiter is off
  # because the BFF is its only client. Pinned — never float `latest`.
  #
  # searxng and ddg-mcp are opt-in together, behind the `search` profile
  # (COMPOSE_PROFILES contains "search"). Without them the BFF still registers
  # web_search / fetch_webpage, and each call fails with the backend's error;
  # Settings → Web can switch the tools off. Removing the profile does not
  # remove running containers — stop them yourself:
  #   docker compose -f docker/compose.yml --profile search rm -sf searxng ddg-mcp
  searxng:
    profiles: ["search"]
    build:
      context: searxng
      args:
        SEARXNG_VERSION: ${SEARXNG_VERSION:-2026.9.23-3cd69d30e}
    image: lettuce-searxng:${SEARXNG_VERSION:-2026.9.23-3cd69d30e}
    environment:
      TZ: ${TZ:-America/Los_Angeles}
    restart: unless-stopped

  # DuckDuckGo via duckduckgo-mcp-server (see docker/ddg-mcp/Dockerfile for why
  # it is a sidecar): the page fetcher behind the native `fetch_webpage` tool
  # and the search fallback when SearXNG is down or blocked. The BFF calls it
  # at http://ddg-mcp:8000/mcp (DDG_MCP_URL on the bff); it is no longer in the
  # agents' shared MCP list. No `ports:`: nothing outside the compose network
  # can reach it, and it has no auth.
  ddg-mcp:
    profiles: ["search"]
    build:
      context: ddg-mcp
      args:
        DDG_MCP_VERSION: ${DDG_MCP_VERSION:-0.7.0}
    image: lettuce-ddg-mcp:${DDG_MCP_VERSION:-0.7.0}
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      DDG_REGION: ${DDG_REGION:-us-en}
      DDG_SAFE_SEARCH: ${DDG_SAFE_SEARCH:-OFF}
      # Long result URLs normally come back as ref:// tokens meant for an agent
      # to expand; the BFF hands results straight to the model, so keep them real.
      DDG_REF_URL_THRESHOLD: "0"
    restart: unless-stopped

  # Gmail, Calendar and Tasks for agents: workspace-mcp under a supervisor that
  # runs it only as Settings → Google says (docker/google-mcp). Agents reach it
  # as http://google-mcp:8000/mcp — the BFF adds that to the shared MCP list
  # while it serves. No `ports:` and no auth, like ddg-mcp: reaching it is not
  # the control. What it may do is fixed by two things no agent can touch —
  # the token's OAuth scopes and workspace-mcp's `--permissions` — both on the
  # two volumes below, which only this service and the BFF mount.
  #
  # Opt-in behind the `google` profile (COMPOSE_PROFILES contains "google").
  # Without it Google is off everywhere: the BFF treats the stored Settings
  # switch as disabled no matter what it says — no native Google tool is
  # registered (the BFF registers only tools the sidecar lists), no sidecar
  # config is rendered on, and the shared-MCP-list entry is removed.
  # To turn it off, drop the profile and
  #   docker compose -f docker/compose.yml --profile google rm -sf google-mcp
  google-mcp:
    profiles: ["google"]
    build:
      context: google-mcp
      args:
        WORKSPACE_MCP_VERSION: ${WORKSPACE_MCP_VERSION:-1.29.0}
    image: lettuce-google-mcp:${WORKSPACE_MCP_VERSION:-1.29.0}
    environment:
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      - google-policy:/policy:ro
      # Read-write: workspace-mcp stores the refreshed access token here.
      - google-creds:/creds
    restart: unless-stopped

  # Outbound-only, dashboard-managed tunnel: the public-hostname-to-origin
  # mapping lives in the Cloudflare Zero Trust dashboard (see docker/README.md),
  # not in a local config.yml. No ports, no network_mode — it joins Compose's
  # default network like any other service, which is what lets it resolve
  # `app-server` (the BFF's port 8080 answers there too — see the note above
  # `bff.network_mode`).
  #
  # profiles gates whether this container is even CREATED: with
  # COMPOSE_PROFILES unset (local mode, the default), `docker compose up -d`
  # skips it entirely. Set COMPOSE_PROFILES=cloudflared to opt in (alongside
  # any others, e.g. cloudflared,google,search).
  #
  # TUNNEL_TOKEN stays soft-optional (`:-`, not `:?`) on purpose even though
  # cloudflared cannot run without one: Compose interpolates every service's
  # environment at parse time regardless of profile activation, so a hard
  # `:?` requirement here would break local mode's `up`/`build` even though
  # this container never gets created — that was exactly the placeholder-token
  # workaround this change removes. In cloudflared mode, an empty token just
  # means cloudflared itself fails at startup with an auth error (see its own
  # logs) — scoped to this one container, not the rest of the stack.
  cloudflared:
    image: cloudflare/cloudflared:2026.8.3
    command: tunnel --no-autoupdate run
    profiles: ["cloudflared"]
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      app-server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # The only named volume left. Everything durable — agent memory, conversations,
  # settings.json, agent workspaces — lives under LETTA_STATE_DIR on the host
  # instead, where it can be inspected and backed up with ordinary tools.
  bff-data:
  # Settings → Google: the BFF and google-mcp only (see those services). Losing
  # them means reconnecting Google, nothing more — Google holds the account.
  google-policy:
  google-creds:
